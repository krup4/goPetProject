version: "3"
services:
  db:
    container_name: postgresql
    image: postgres:16
    command: -db-ssl-mode=allow
    ports:
      - "5432:5432"
    volumes:
      - ./web/postgres_data/:/var/lib/postgresql/data
      - ./web/postgres-custom-config:/etc/postgresql
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U default_user -d api_database" ]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    container_name: api
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    command: ./application
    depends_on:
      db:
        condition: service_healthy